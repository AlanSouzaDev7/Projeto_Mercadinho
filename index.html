<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Calculadora de compras do mercado: defina quanto pode gastar e acompanhe o total em tempo real.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mercadinho</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app" id="app" data-mode="setup">

    <!-- Topo -->
    <header class="topbar">
      <h1 class="brand">Mercadinho</h1>
      <div class="topbar-actions">
        <button class="chip" id="budgetChip" type="button" aria-label="Alterar limite de gastos">
          <span class="chip-label">Limite</span>
          <span id="budgetChipValue">R$ 0,00</span>
        </button>
        <button class="icon-btn" id="newBtn" type="button" aria-label="Nova compra" title="Nova compra">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.34-5.66M4 4v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <!-- Tela de definição do limite -->
    <section class="setup" aria-labelledby="setupTitle">
      <h2 id="setupTitle" class="setup-title">Quanto você pode gastar hoje?</h2>
      <p class="setup-hint">Digite o valor no teclado ou escolha um atalho.</p>
      <div class="quick" role="group" aria-label="Valores rápidos">
        <button type="button" class="quick-btn" data-quick="5000">R$ 50</button>
        <button type="button" class="quick-btn" data-quick="10000">R$ 100</button>
        <button type="button" class="quick-btn" data-quick="20000">R$ 200</button>
        <button type="button" class="quick-btn" data-quick="50000">R$ 500</button>
      </div>
      <button type="button" class="link-btn" id="cancelSetup" hidden>Cancelar</button>
    </section>

    <!-- Resumo da compra -->
    <section class="summary" aria-label="Resumo da compra">
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Gasto</span>
          <span class="stat-value" id="spentValue">R$ 0,00</span>
        </div>
        <div class="stat">
          <span class="stat-label" id="remainingLabel">Restante</span>
          <span class="stat-value" id="remainingValue">R$ 0,00</span>
        </div>
        <div class="stat stat-small">
          <span class="stat-label">Itens</span>
          <span class="stat-value" id="countValue">0</span>
        </div>
      </div>
      <div class="bar" role="progressbar" aria-label="Quanto do limite já foi usado" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar">
        <div class="bar-fill" id="barFill"></div>
      </div>

      <div class="alert" id="alert" role="alert" hidden>
        <p class="alert-title" id="alertTitle"></p>
        <p class="alert-text" id="alertText"></p>
        <p class="alert-tip" id="alertTip"></p>
      </div>
    </section>

    <!-- Lista de itens -->
    <section class="list-wrap" aria-label="Itens adicionados">
      <ol class="list" id="list"></ol>
      <p class="empty" id="empty">Digite o preço do produto e toque em <strong>+</strong></p>
    </section>

    <!-- Visor -->
    <section class="display" aria-live="polite">
      <p class="preview" id="preview">&nbsp;</p>
      <output class="screen" id="screen">R$ 0,00</output>
    </section>

    <!-- Teclado -->
    <section class="keypad" id="keypad" aria-label="Teclado">
      <button type="button" class="key key-fn" data-key="clear" aria-label="Limpar">AC</button>
      <button type="button" class="key key-fn" data-key="back" aria-label="Apagar último dígito">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z M12 9l6 6 M18 9l-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="key key-fn" data-key="times" aria-label="Quantidade (multiplicar)">×</button>
      <button type="button" class="key key-op" data-key="undo" aria-label="Remover último item">−</button>

      <button type="button" class="key" data-key="7">7</button>
      <button type="button" class="key" data-key="8">8</button>
      <button type="button" class="key" data-key="9">9</button>
      <button type="button" class="key key-op key-add" data-key="add" aria-label="Adicionar item" id="addKey">
        <span class="add-sign" id="addSign">+</span>
        <span class="add-label" id="addLabel">Adicionar</span>
      </button>

      <button type="button" class="key" data-key="4">4</button>
      <button type="button" class="key" data-key="5">5</button>
      <button type="button" class="key" data-key="6">6</button>

      <button type="button" class="key" data-key="1">1</button>
      <button type="button" class="key" data-key="2">2</button>
      <button type="button" class="key" data-key="3">3</button>

      <button type="button" class="key key-wide" data-key="0">0</button>
      <button type="button" class="key" data-key="00">00</button>
    </section>

    <div class="toast" id="toast" role="status" hidden>
      <span id="toastText"></span>
      <button type="button" class="toast-btn" id="toastUndo">Desfazer</button>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
